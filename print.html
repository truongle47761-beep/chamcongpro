<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Báo cáo chấm công</title>
<style>
body{margin:0;background:#f6f4f9;color:#29243a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.print-toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 12px;background:#fff;border-bottom:1px solid #e8e2ef}
.print-toolbar button{border:0;border-radius:12px;padding:12px 18px;background:#8064c8;color:#fff;font-size:15px;font-weight:700}
.print-toolbar span{font-size:12px;color:#666}
#pdfExportRoot{display:block!important;padding:16px;background:#fff;max-width:1100px;margin:16px auto;box-shadow:0 4px 20px #0000000d}
@media print{.print-toolbar{display:none!important}#pdfExportRoot{display:block!important;position:static!important;padding:0!important;margin:0!important;max-width:none!important;box-shadow:none!important}}
</style>
</head>
<body>
<div class="print-toolbar"><button id="printNow" type="button">Mở tùy chọn in của iPhone</button><span>Nếu bảng in chưa tự mở, chạm nút này.</span></div>
<div id="pdfExportRoot"></div>
<script>
(function(){
 try{
  const payload=JSON.parse(decodeURIComponent(location.hash.slice(1)));
  const style=document.createElement('style');
  style.textContent=payload.styles||'';
  document.head.appendChild(style);
  document.getElementById('pdfExportRoot').innerHTML=payload.reportHTML||'';
  document.getElementById('printNow').addEventListener('click',function(){window.print()});
  window.addEventListener('load',function(){setTimeout(function(){window.print()},700)});
 }catch(e){
  document.getElementById('pdfExportRoot').textContent='Không tải được báo cáo. Bà hãy quay lại app và xuất PDF lại nhé.';
  document.getElementById('printNow').style.display='none';
 }
})();
</script>
</body>
</html>
